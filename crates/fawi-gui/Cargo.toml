[package]
name = "fawi-gui"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fawi-gui"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["hydration"] }
leptos_meta = "0.8"
leptos_router = "0.8"
fawi-core = { path = "../fawi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
futures = "0.3"

# server-side (SSR) dependencies
reqwest = { version = "0.12", default-features = false, features = ["json"] }
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# client-side (hydration) dependencies
gloo-net = { version = "0.6", features = ["websocket"], optional = true }
web-sys = { version = "0.3", features = ["Window", "Location"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
send_wrapper = { version = "0.6", features = ["futures"], optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:gloo-net",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "dep:send_wrapper",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:clap",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[package.metadata.leptos]
output-name = "okf"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:8081"
reload-port = 3001
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
