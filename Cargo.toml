[workspace]
resolver = "2"
members = [
    "crates/fawi-core",
    "crates/fawi-storage",
    "crates/fawi-gui",
    "crates/fawi-server",
    "crates/fawi-cli",
    "crates/fawi-search",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comrak = "0.24"
futures = "0.3"
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
